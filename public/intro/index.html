<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>CHUD-POL Garage – czołówka</title>
<meta name="theme-color" content="#020204">
<link rel="icon" href="../assets/icon-32.png" sizes="32x32" type="image/png">
<style>
@font-face { font-family: "Archivo"; src: url("../assets/archivo-latin-ext-wdth-normal.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; font-display: swap;
  unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
@font-face { font-family: "Archivo"; src: url("../assets/archivo-latin-wdth-normal.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; font-display: swap;
  unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#020204;font-family:"Archivo",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation}

#startBtn{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;flex-direction:column;
  background:radial-gradient(ellipse at center,#0a0a10,#020204);border:none;outline:none;cursor:pointer;-webkit-appearance:none;appearance:none;font-family:inherit}
#startBtn span{color:rgba(217,174,67,.75);font-size:14px;font-weight:700;font-stretch:115%;letter-spacing:4px;text-transform:uppercase;animation:pulse 2s ease-in-out infinite}
#startBtn img{width:96px;height:96px;margin-bottom:30px;opacity:.55}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:.95}}
#startBtn.gone{opacity:0;pointer-events:none;transition:opacity .5s}

.scene{position:fixed;inset:0;perspective:900px;perspective-origin:50% 48%;display:flex;align-items:center;justify-content:center;background:#020204;opacity:0}
.scene.on{opacity:1;transition:opacity .3s}
.stars{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:0;transition:opacity 1s;
  background:radial-gradient(1px 1px at 8% 12%,rgba(180,160,100,.3),transparent),radial-gradient(1px 1px at 22% 78%,rgba(160,140,80,.2),transparent),radial-gradient(1.2px 1.2px at 38% 35%,rgba(200,180,110,.35),transparent),radial-gradient(1px 1px at 65% 62%,rgba(180,160,100,.3),transparent),radial-gradient(1.3px 1.3px at 78% 22%,rgba(160,150,90,.3),transparent),radial-gradient(1px 1px at 15% 55%,rgba(200,180,110,.25),transparent),radial-gradient(1px 1px at 92% 48%,rgba(180,160,100,.3),transparent)}
.stars.on{opacity:1}
.glow{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:0;transition:opacity .8s;background:radial-gradient(ellipse at 50% 50%,rgba(60,45,12,.22),transparent 70%)}
.glow.on{opacity:1}

.coin{width:min(80vw,72vh,480px);height:min(80vw,72vh,480px);position:relative;transform-style:preserve-3d;opacity:0;transform:scale(.3) rotateY(0deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face img{width:100%;height:100%;object-fit:contain}
.front{transform:translateZ(2px)}
.back{transform:rotateY(180deg) translateZ(2px);display:flex;align-items:center;justify-content:center}
/* druga strona: tabliczka z kontaktem */
.plyta{width:92%;padding:9% 6%;text-align:center;color:#EFEADB;border:2px solid #D9AE43;box-shadow:inset 0 0 0 6px #060606,inset 0 0 0 7px rgba(217,174,67,.5),0 0 40px -8px rgba(217,174,67,.5);
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 1px,rgba(255,255,255,0) 1px 3px),linear-gradient(180deg,#1D1B17,#0B0B0A)}
.plyta .p-nazwa{display:block;font-weight:800;font-stretch:115%;text-transform:uppercase;letter-spacing:.08em;font-size:min(4.6vw,4.1vh,27px);
  background:linear-gradient(180deg,#F7E7AE 0%,#E3BC55 38%,#C2932B 62%,#E8C76A 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.plyta .p-tel{display:block;margin-top:.5em;font-weight:800;font-stretch:112%;font-variant-numeric:tabular-nums;letter-spacing:.02em;font-size:min(9.4vw,8.4vh,56px);color:#fff;white-space:nowrap}
.plyta .p-adres{display:block;margin-top:.6em;font-size:min(4.2vw,3.8vh,25px);font-weight:500;color:#C9C2B0}
.plyta .p-godz{display:block;margin-top:.5em;font-size:min(3.3vw,3vh,19px);color:#A49C88;font-variant-numeric:tabular-nums}

.sw{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;pointer-events:none;transform:translateZ(3px);
  background:linear-gradient(105deg,transparent 40%,rgba(255,240,180,.14) 48%,rgba(255,250,220,.24) 50%,rgba(255,240,180,.14) 52%,transparent 60%);opacity:0}
.sw-b{transform:rotateY(180deg) translateZ(3px)}
.lsh{position:absolute;bottom:-15%;left:15%;right:15%;height:20%;background:radial-gradient(ellipse,rgba(180,150,60,.2),transparent 70%);filter:blur(20px);opacity:0;transform:rotateX(60deg)}

.tag{position:fixed;bottom:17%;left:50%;transform:translateX(-50%);font-weight:700;font-stretch:112%;font-size:clamp(10px,2.5vw,16px);letter-spacing:clamp(3px,1vw,8px);
  color:rgba(217,174,67,0);text-transform:uppercase;white-space:nowrap;z-index:5;transition:color 1.2s}
.tag.on{color:rgba(217,174,67,.85)}
.wejdz{position:fixed;bottom:6%;left:50%;transform:translateX(-50%);z-index:6;opacity:0;pointer-events:none;transition:opacity 1s;
  font-weight:700;font-stretch:112%;font-size:.9rem;letter-spacing:.07em;text-transform:uppercase;text-decoration:none;white-space:nowrap;
  color:#060606;padding:.8rem 1.5rem;border:2px solid #F2D27C;border-radius:4px;background:linear-gradient(180deg,#F7E7AE 0%,#E3BC55 38%,#C2932B 62%,#E8C76A 100%)}
.wejdz.on{opacity:1;pointer-events:auto}
.fl{position:fixed;inset:0;background:radial-gradient(ellipse,rgba(255,240,180,.5),rgba(200,170,80,.1));opacity:0;pointer-events:none;z-index:50;transition:opacity .1s}
.vig{position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.6) 100%);pointer-events:none;z-index:2;opacity:0;transition:opacity .5s}
.vig.on{opacity:1}
@keyframes slowSpin{0%{transform:rotateX(2deg) rotateY(0deg) translateY(0)}25%{transform:rotateX(-1deg) rotateY(90deg) translateY(-6px)}50%{transform:rotateX(2deg) rotateY(180deg) translateY(0)}75%{transform:rotateX(-1deg) rotateY(270deg) translateY(-6px)}100%{transform:rotateX(2deg) rotateY(360deg) translateY(0)}}
</style>
</head>
<body>

<button id="startBtn" onclick="startIntro()">
<img src="../assets/logo-112.webp" alt="">
<span>Dotknij, aby rozpocząć</span>
</button>

<div class="scene" id="scene">
<div class="stars" id="stars"></div>
<div class="glow" id="glow"></div>
<div class="coin" id="coin">
<div class="face front"><img src="../assets/logo.webp" alt="Logo CHUD-POL Garage"></div>
<div class="sw" id="sw1"></div>
<div class="face back"><div class="plyta">
  <span class="p-nazwa">CHUD-POL Garage</span>
  <span class="p-tel">732 931 287</span>
  <span class="p-adres">Legnicka 56, Chojnów</span>
  <span class="p-godz">Pn–Pt 8:00–17:00, Sob 8:00–13:00</span>
</div></div>
<div class="sw sw-b" id="sw2"></div>
<div class="lsh" id="lsh"></div>
</div>
<div class="tag" id="tag">Mechanika &#8226; Wulkanizacja &#8226; Części</div>
</div>
<a class="wejdz" id="wejdz" href="../">Wejdź na stronę</a>
<div class="fl" id="fl"></div>
<div class="vig" id="vig"></div>

<script>

function startIntro() {
  var btn = document.getElementById("startBtn");
  btn.className = "gone";

  var ac = null;
  try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}

  var scene = document.getElementById("scene");
  var coin = document.getElementById("coin");
  var stars = document.getElementById("stars");
  var glow = document.getElementById("glow");
  var sw1 = document.getElementById("sw1");
  var sw2 = document.getElementById("sw2");
  var lsh = document.getElementById("lsh");
  var tag = document.getElementById("tag");
  var fl = document.getElementById("fl");
  var vig = document.getElementById("vig");

  /* --- SOUND FUNCTIONS --- */
  function boom(when, vol) {
    if (!ac) return;
    var t = ac.currentTime + when;
    var o = ac.createOscillator();
    var g = ac.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(80, t);
    o.frequency.exponentialRampToValueAtTime(25, t + 0.8);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 1.2);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + 1.2);
  }

  function whoosh(when) {
    if (!ac) return;
    var t = ac.currentTime + when;
    var len = Math.floor(ac.sampleRate * 0.5);
    var buf = ac.createBuffer(1, len, ac.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/len, 2);
    var s = ac.createBufferSource(); s.buffer = buf;
    var f = ac.createBiquadFilter(); f.type = "bandpass";
    f.frequency.setValueAtTime(800, t);
    f.frequency.exponentialRampToValueAtTime(2500, t + 0.4);
    f.Q.value = 2;
    var g = ac.createGain();
    g.gain.setValueAtTime(0.001, t);
    g.gain.linearRampToValueAtTime(0.25, t + 0.08);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
    s.connect(f); f.connect(g); g.connect(ac.destination);
    s.start(t);
  }

  function shimmer(when) {
    if (!ac) return;
    var t = ac.currentTime + when;
    for (var i = 0; i < 5; i++) {
      var o = ac.createOscillator();
      var g = ac.createGain();
      o.type = "sine";
      var fr = 2000 + i*800 + Math.random()*400;
      o.frequency.setValueAtTime(fr, t);
      o.frequency.exponentialRampToValueAtTime(fr*0.7, t + 1.5);
      g.gain.setValueAtTime(0.001, t + i*0.05);
      g.gain.linearRampToValueAtTime(0.03, t + i*0.05 + 0.05);
      g.gain.exponentialRampToValueAtTime(0.001, t + 1.5);
      o.connect(g); g.connect(ac.destination);
      o.start(t + i*0.05); o.stop(t + 1.5);
    }
  }

  function engine(when) {
    if (!ac) return;
    var t = ac.currentTime + when;
    var o1 = ac.createOscillator(); var o2 = ac.createOscillator();
    var g = ac.createGain();
    o1.type = "sawtooth"; o2.type = "square";
    o1.frequency.setValueAtTime(60,t);
    o1.frequency.linearRampToValueAtTime(120,t+0.4);
    o1.frequency.linearRampToValueAtTime(40,t+2);
    o2.frequency.setValueAtTime(30,t);
    o2.frequency.linearRampToValueAtTime(60,t+0.4);
    o2.frequency.linearRampToValueAtTime(20,t+2);
    g.gain.setValueAtTime(0.001,t);
    g.gain.linearRampToValueAtTime(0.12,t+0.3);
    g.gain.exponentialRampToValueAtTime(0.001,t+2);
    var f = ac.createBiquadFilter(); f.type="lowpass";
    f.frequency.setValueAtTime(200,t);
    f.frequency.linearRampToValueAtTime(500,t+0.4);
    f.frequency.linearRampToValueAtTime(150,t+2);
    f.Q.value=5;
    o1.connect(f);o2.connect(f);f.connect(g);g.connect(ac.destination);
    o1.start(t);o2.start(t);o1.stop(t+2);o2.stop(t+2);
  }

  function riser(when, dur) {
    if (!ac) return;
    var t = ac.currentTime + when;
    var len = Math.floor(ac.sampleRate * dur);
    var buf = ac.createBuffer(1, len, ac.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) { var p=i/len; d[i]=(Math.random()*2-1)*p*p*0.5; }
    var s = ac.createBufferSource(); s.buffer=buf;
    var f = ac.createBiquadFilter(); f.type="bandpass";
    f.frequency.setValueAtTime(200,t);
    f.frequency.exponentialRampToValueAtTime(3000,t+dur);
    f.Q.value=1;
    var g = ac.createGain();
    g.gain.setValueAtTime(0.001,t);
    g.gain.linearRampToValueAtTime(0.2,t+dur*0.9);
    g.gain.linearRampToValueAtTime(0,t+dur);
    s.connect(f);f.connect(g);g.connect(ac.destination);
    s.start(t);
  }

  /* --- TIMELINE --- */
  scene.className = "scene on";
  riser(0, 2.0);

  setTimeout(function(){ vig.className="vig on"; }, 300);
  setTimeout(function(){ stars.className="stars on"; }, 500);

  // Logo appears
  setTimeout(function(){
    boom(0, 0.5);
    engine(0.1);
    coin.style.transition = "opacity 0.1s, transform 0.6s cubic-bezier(0.2,0.8,0.2,1.2)";
    coin.style.opacity = "1";
    coin.style.transform = "scale(1.15) rotateY(0deg)";
  }, 1000);

  // Settle
  setTimeout(function(){
    coin.style.transition = "transform 0.4s ease-out";
    coin.style.transform = "scale(1) rotateY(0deg)";
  }, 1600);

  // Glow + sweep
  setTimeout(function(){ glow.className="glow on"; }, 1600);
  setTimeout(function(){
    shimmer(0);
    sw1.style.transition = "opacity 0.2s";
    sw1.style.opacity = "1";
    setTimeout(function(){
      sw1.style.transition = "transform 1s ease, opacity 0.3s";
      sw1.style.transform = "translateZ(3px) translateX(120%)";
      setTimeout(function(){ sw1.style.opacity="0"; }, 800);
    }, 200);
  }, 1800);

  // Shadow
  setTimeout(function(){
    lsh.style.transition = "opacity 0.6s";
    lsh.style.opacity = "1";
  }, 2000);

  // Sway front
  setTimeout(function(){
    coin.style.transition = "transform 1.5s ease-in-out";
    coin.style.transform = "scale(1) rotateY(8deg) rotateX(2deg)";
  }, 2500);
  setTimeout(function(){
    coin.style.transition = "transform 1.5s ease-in-out";
    coin.style.transform = "scale(1) rotateY(-5deg) rotateX(-1deg)";
  }, 4000);

  // Flip to gold
  setTimeout(function(){
    whoosh(0);
    coin.style.transition = "transform 0.8s cubic-bezier(0.4,0,0.2,1)";
    coin.style.transform = "scale(1.05) rotateY(180deg) rotateX(2deg)";
  }, 5000);

  // Impact
  setTimeout(function(){
    boom(0, 0.35);
    coin.style.transition = "transform 0.3s ease-out";
    coin.style.transform = "scale(1) rotateY(180deg) rotateX(0deg)";
    fl.style.transition = "opacity 0.08s";
    fl.style.opacity = "0.5";
    setTimeout(function(){
      fl.style.transition = "opacity 0.4s";
      fl.style.opacity = "0";
    }, 80);
  }, 5800);

  // Shimmer gold
  setTimeout(function(){
    shimmer(0);
    sw2.style.transition = "opacity 0.2s";
    sw2.style.opacity = "1";
    setTimeout(function(){
      sw2.style.transition = "transform 1s ease, opacity 0.3s";
      sw2.style.transform = "rotateY(180deg) translateZ(3px) translateX(-120%)";
      setTimeout(function(){ sw2.style.opacity="0"; }, 800);
    }, 200);
  }, 6200);

  // Sway gold
  setTimeout(function(){
    coin.style.transition = "transform 1.5s ease-in-out";
    coin.style.transform = "scale(1) rotateY(188deg) rotateX(2deg)";
  }, 6500);
  setTimeout(function(){
    coin.style.transition = "transform 1.5s ease-in-out";
    coin.style.transform = "scale(1) rotateY(174deg) rotateX(-1deg)";
  }, 8000);

  // Tagline
  setTimeout(function(){
    shimmer(0.2);
    tag.className = "tag on";
  }, 8500);

  // Final spin out
  setTimeout(function(){
    whoosh(0);
    coin.style.transition = "transform 1s cubic-bezier(0.4,0,0.2,1)";
    coin.style.transform = "scale(1) rotateY(360deg) rotateX(0deg)";
  }, 10000);

  // Infinite loop
  setTimeout(function(){
    coin.style.transition = "none";
    coin.style.transform = "rotateY(0deg)";
    setTimeout(function(){
      coin.style.animation = "slowSpin 12s linear infinite";
      document.getElementById("wejdz").className = "wejdz on";
    }, 50);
  }, 11200);
}

</script>
</body>
</html>
